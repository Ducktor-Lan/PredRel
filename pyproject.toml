[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predrel"
version = "1.0.0"
description = "PredRel: TabPFN predictive-relation analysis and distillation (unified package)."
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "scikit-learn",
]

[project.optional-dependencies]
teacher = [
  "torch",
  "tabpfn",
  "tabpfn-extensions[interpretability]",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
